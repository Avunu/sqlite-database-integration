name: Upstream Sync Merge

# The merge gate for the pull request maintained by `upstream-sync.yml`.
#
# It merges that pull request into `d1-support` as soon as GitHub reports the
# merge as clean and every check on it has succeeded. Anything else — a
# conflict, a failing suite, a check still running — is left alone, which is
# what keeps the pull request standing as the place where upstream drift is
# visible and manual intervention is implied.
#
# It runs whenever a check on the sync branch finishes, so a green run merges
# within a minute or two, including after someone pushes a conflict resolution.
# The hourly schedule is a backstop for anything the `workflow_run` list misses.
# Listing a workflow here is therefore only about latency, never correctness:
# the gate always re-reads every check on the pull request.
#
# Before merging it also confirms the pull request head carries this fork's own
# workflows, so upstream code can never be merged having been tested only by
# upstream's suites.

on:
  workflow_run:
    workflows:
      - CS
      - D1 Backend Tests
      - End-to-end Tests
      - Lexer benchmark
      - MySQL Parser Tests
      - MySQL Proxy Tests
      - PHPUnit Tests
      - SQLite Plugin PHPUnit Tests
      - Verify release metadata
      - WASM extension build
      - WordPress End-to-end Tests
      - WordPress PHPUnit Tests
    types: [completed]
  schedule:
    - cron: '47 * * * *' # Hourly.
  workflow_dispatch:

# Serialize the gate so simultaneous check completions cannot race into a
# double merge.
concurrency:
  group: upstream-sync-merge
  cancel-in-progress: false

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  merge:
    name: Merge the sync pull request when it is clean and green
    if: >-
      github.repository == 'Avunu/sqlite-database-integration'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'upstream-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SYNC_BRANCH: upstream-sync
      BASE_BRANCH: d1-support
      # A fork-only file: its presence in the pull request head proves the head
      # carries this fork's workflows and not a bare copy of the upstream trunk.
      SENTINEL_WORKFLOW: .github/workflows/d1-backend-tests.yml

    steps:
      - name: Merge the sync pull request
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The UPSTREAM_SYNC_TOKEN secret is missing. See the header of upstream-sync.yml for how to create it."
            exit 1
          fi

          PR="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "No open sync pull request; nothing to merge."
            exit 0
          fi

          # GitHub computes mergeability asynchronously, so a freshly updated
          # pull request reports UNKNOWN for a few seconds.
          STATE=UNKNOWN
          for _ in $(seq 1 10); do
            STATE="$(gh pr view "$PR" --json mergeable --jq '.mergeable')"
            [ "$STATE" = 'UNKNOWN' ] || break
            sleep 6
          done

          if [ "$STATE" != 'MERGEABLE' ]; then
            echo "Pull request #$PR is not mergeable (state: $STATE); leaving it open."
            exit 0
          fi

          # Read the head before the checks, so the merge below can refuse to
          # run if the branch moved while the gate was evaluating it.
          HEAD_SHA="$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')"

          # A head that does not carry the fork's own workflows cannot have run
          # the fork's own suites, whatever the checks below say. That is the
          # shape `upstream-sync.yml` pushes only while the merge conflicts, so
          # it should never reach a mergeable pull request — but the whole point
          # of this gate is that upstream code is never merged untested.
          if ! gh api "repos/$GH_REPO/contents/$SENTINEL_WORKFLOW?ref=$HEAD_SHA" --silent > /dev/null 2>&1; then
            echo "::warning::The head of #$PR does not contain $SENTINEL_WORKFLOW, so the fork's suites did not run. Not merging."
            exit 0
          fi

          # `gh pr checks` exits non-zero when checks are pending or failing,
          # and when a pull request has no checks at all.
          CHECKS="$(gh pr checks "$PR" --json bucket,name,state 2>/dev/null)" || true

          if [ -z "$CHECKS" ] || [ "$CHECKS" = '[]' ]; then
            echo "No checks have been reported on pull request #$PR yet; waiting."
            exit 0
          fi

          BLOCKING="$(printf '%s' "$CHECKS" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length')"
          PASSING="$(printf '%s' "$CHECKS" | jq -r '[.[] | select(.bucket == "pass")] | length')"

          if [ "$BLOCKING" -ne 0 ]; then
            echo "Pull request #$PR has $BLOCKING check(s) that are not passing; leaving it open:"
            printf '%s' "$CHECKS" | jq -r '.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel") | "  \(.bucket)\t\(.name)"'
            exit 0
          fi

          if [ "$PASSING" -eq 0 ]; then
            echo "Pull request #$PR has no passing checks; leaving it open."
            exit 0
          fi

          echo "Pull request #$PR is clean with $PASSING passing check(s). Merging $HEAD_SHA."

          # A merge commit, never a squash: keeping the shared history with
          # upstream intact is what makes every subsequent merge tractable.
          # `--match-head-commit` guarantees only the reviewed head is merged,
          # should a sync run push a new upstream commit at the same moment.
          if OUTPUT="$(gh pr merge "$PR" \
            --merge \
            --match-head-commit "$HEAD_SHA" \
            --subject "Merge upstream trunk into $BASE_BRANCH" \
            --body "Automated upstream sync (#$PR)." 2>&1)"
          then
            echo "$OUTPUT"
          else
            echo "$OUTPUT"
            case "$OUTPUT" in
              *'Head branch was modified'*|*'head commit'*)
                echo "::notice::The sync branch moved while the gate was running; the next run retries."
                exit 0
                ;;
            esac
            exit 1
          fi

          # Deleted explicitly rather than with `--delete-branch`, which also
          # reaches for a local checkout this job does not have.
          if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$SYNC_BRANCH" > /dev/null 2>&1; then
            echo "Deleted the sync branch."
          else
            echo "The sync branch was already removed."
          fi
